schema: spec-driven

context: |
  ## プロダクト
  ホットクックで作った自作レシピを Markdown で管理し、「今日何を作ろう」と思ったときに
  料理名や具材を1つの入力に打って Google 検索のように探せる静的サイト。

  ## 全体地図
  - 静的サイト＋GitHub Pages。リポジトリそのものがレシピの保管場所（バックエンド）。サーバ・DBなし
  - レシピは 1レシピ＝1 Markdown ファイル（frontmatter＋本文）として著者が編集する
  - ビルド時にレシピを検索用の構造化データ（JSON）に変換する。重い処理はすべてビルド時に寄せる
  - ブラウザはその JSON を読んで検索・表示するだけ

  ## 用語（この語彙で書く）
  - レシピ: ホットクックで作る一品の記録。料理名・材料・調理方法・手順メモからなる。1レシピ＝1ファイル
  - 料理名: 利用者が自分でつけたその一品の名前。自動調理キーの名称とは独立で、一致しなくてよい。
    Avoid: タイトル（フィールド名としては使ってよいが、ドメイン語としては「料理名」）
  - 材料: レシピに使う食材の並び。量・単位は分けず「豚バラ肉 200g」のような1行の文字列。複数可
  - 自動調理キー: ホットクックにプリセットされた自動調理の名称（例: 豚の角煮）。任意。
    Avoid: コース、プリセットメニュー名
  - 自動メニュー番号: 自動調理キーに対応する番号（例: "048"）。自動調理キーと1対1ではなく、
    機種によって番号が変わる。任意。Avoid: メニューID
  - 手動設定: 自動調理キーを使わず手動で調理する場合の設定メモ（例: 蒸し野菜 10分）。任意
  - 機種: 利用者が使っているホットクックの型。自動メニュー番号の基準になるが、レシピには記録しない
    （利用者は1台運用のため。現在の機種名は README に1行記す）
  - 調理方法の項目（自動調理キー・自動メニュー番号・手動設定）は排他ではない。どの組み合わせも、
    どれも書かないこともある。「自動／手動」は厳密な型ではなく、埋まっている項目に応じたゆるい呼び名
  - 読み: 料理名や材料に含まれる語を、かなで表したもの（例: 味噌→みそ）。表記の違いを越えて検索する
    ために持つ。レシピには書かず、語と読みの対応表から与える。
    Avoid: ふりがな、ルビ（表示のために振るものではないため）
  - 対応表: 語と読みの組を集めたもの。レシピに現れる語だけを持ち、汎用の日本語辞書は持たない。
    自動で生成される部分と、著者が誤読を訂正する部分に分かれる

  ## 常設の制約（覆す場合は design.md で決定として明示する）
  - プロダクションコード（ビルドスクリプト・ブラウザで動くコード）は可能な限り Node／ブラウザの標準 API だけで書く。
    第三者ライブラリを入れる場合は最小依存のものを選び、design.md の決定（D-番号）で理由を明示する。
    テスト・lint・format 等の開発ツールは devDependencies として導入してよい
  - フロントは HTML+CSS+JS のみ。フレームワーク・バンドラを使わない
  - ブラウザで動く第三者コードは最小限にする。使う場合は lockfile で版と integrity を固定し、
    リポジトリ内に同梱（vendoring）し、SRI を付けて配信する。CDN から読み込まない
  - Markdown の frontmatter 解析に多機能ライブラリを持ち込まない（供給網を最小に保つ。YAML 解析だけを現役の
    パーサに委ねる）
  - レシピの不備（必須項目欠落・YAML 破損）はビルドを失敗させて気づけるようにする（fail fast）
  - 構造化データ（JSON・frontmatter・プレーン本文）と「データ化／検索」の層分離を壊さない。
    意味検索・AIチャット・MCP 公開などは将来"足し算"で載せる前提だが、現時点では何も作らない
  - Node のバージョンは .node-version を単一の真実源とし、mise.toml の [tools] には書かない
    （二重管理を作らない。CI もこのファイルを参照する）

  ## 技術スタック・規約
  - Node.js（版は .node-version に従う）、npm＋package-lock.json、ESM
  - 開発ツール: oxlint（lint）、oxfmt（format）、vitest（テストランナー）、fast-check（プロパティベーステスト）
  - 依存の追加・更新は .npmrc の min-release-age で公開直後の版を掴まない
  - ドキュメント・コード内コメントは日本語。コミットは Conventional Commits

rules:
  proposal:
    - 「Non-goals（やらないこと）」の節を必ず含める
  specs:
    - 利用者や下流から観察できる振る舞いだけを書く。ライブラリ名・ファイル名・関数名を書かない
    - エラー条件（fail fast で失敗するケース）のシナリオを必ず含める
    - 日本語で書く。用語は context の用語集に従う
  design:
    - 各決定は ADR の骨格で書く。「背景／検討した選択肢（不採用理由つき）／帰結／見直し条件」を必ず含める
    - 検討した選択肢が1つしかない決定は書き直す
    - 決定には D-01, D-02… の通し番号を振り、archive 後も参照できるようにする
  tasks:
    - 各タスクに、対応する spec の要件名（または design の決定番号）を添える
    - プロパティベーステストのタスクには、検証する性質（往復性・不変条件など）を明記する

operations:
  apply:
    guidance:
      - specs / design に無い判断が必要になったら、コードを書く前に design.md に決定として追記する
      - タスクを完了にする前に lint・format チェック・テストを通す
      - ビルド生成物（検索インデックス・vendor など）をコミットするか否かは design の決定に従う。未決なら先に決める
  archive:
    guidance:
      - archive の前に verify を通す
